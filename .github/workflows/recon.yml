name: Recon Buzz
on: workflow_dispatch
jobs:
  recon:
    runs-on: self-hosted
    steps:
      - name: Najdi config.yml poradne
        run: |
          echo "## find config.y*ml na celem root FS (bez filtru, bez prechodu na jine FS)"
          find / -xdev \( -name 'config.yml' -o -name 'config.yaml' \) 2>/dev/null || true
          echo
          echo "## soubory obsahujici ingress/hostname pravidla (podle obsahu)"
          grep -rlsI -e 'ingress' -e 'service: http' -e 'hostname:' /home/monika /etc /opt /srv 2>/dev/null | head -30 || true
          echo
          echo "## locate (pokud existuje)"
          if command -v locate >/dev/null 2>&1; then locate -i config.yml 2>/dev/null | head -20; else echo "(locate neni)"; fi
          echo
          echo "## .yml/.yaml v docker_projects a home (do hloubky 3)"
          find /home/monika/docker_projects /home/monika -maxdepth 3 \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | grep -viE 'node_modules|/\.git/' | head -40 || true
      - name: Vypis nalezeny ingress config (secrety maskovane)
        run: |
          echo "## obsah souboru s ingress (token/secret/credentials maskovane)"
          for f in $(grep -rlsI -e 'ingress' -e 'hostname:' /home/monika /etc /opt /srv 2>/dev/null | head -10); do
            echo "===== $f ====="
            sed -E 's/(token|secret|credentials|password|key)[=: ].*/\1: ***REDACTED***/I' "$f" 2>/dev/null | head -60
            echo
          done
