name: Recon Buzz
on: workflow_dispatch        # spouští se jen ručně, ne při push
jobs:
  recon:
    runs-on: self-hosted
    steps:
      - name: Jak bezi cloudflared
        run: |
          echo "## ps aux cloudflared (token maskovan)"
          ps aux | grep -E '[c]loudflared' | sed -E 's/(--token|token=)[^ ]*/\1 ***REDACTED***/g'
          echo
          echo "## systemctl cat cloudflared (token maskovan)"
          systemctl cat cloudflared 2>&1 | sed -E 's/(--token|token=)[^ ]*/\1 ***REDACTED***/g'
      - name: Hledam ingress config
        run: |
          echo "## hledam cloudflared config soubory"
          find /etc /home/monika /root /usr/local/etc -maxdepth 4 \( -name 'config.yml' -o -name 'config.yaml' \) 2>/dev/null | grep -i cloud || echo "nic v find"
          echo
          echo "## zkousim precist standardni configy"
          for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml /home/monika/.cloudflared/config.yml /home/monika/.cloudflared/config.yaml; do
            if [ -r "$f" ]; then echo "== $f (citelny) =="; sed -E 's/(token|secret)[=: ].*/\1: ***REDACTED***/I' "$f"; else [ -f "$f" ] && echo "== $f existuje ale necitelny (root) =="; fi
          done
