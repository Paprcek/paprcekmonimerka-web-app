<style>
  .czu-wrap{max-width:1100px;margin:0 auto;padding:0 16px;font-family:'Inter','Source Code Pro',sans-serif}
  .czu-crumbs{font-size:.85rem;color:#9ca3af;margin:4px 0 18px}

  .czu-h1{font-size:1.9rem;font-weight:600;margin:4px 0 14px;color:#4CAF50}
  .czu-h2{font-size:1.35rem;font-weight:500;margin:18px 0 8px;color:#4CAF50}
  .czu-infobox{background:#1f2937;border-left:3px solid #4CAF50;border-radius:6px;padding:14px 16px;margin:0 0 18px;color:#d1d5db}

  .czu-navq.ok{border-color:#22c55e;background:#14532d}.czu-navq.part{border-color:#eab308;background:#713f12}.czu-navq.bad{border-color:#ef4444;background:#7f1d1d}

  @keyframes czu-pulse{to{background:rgba(239,68,68,.15)}}

  .czu-qno{font-size:.95rem;color:#e5e7eb;margin-bottom:4px}.czu-qno b{font-size:1.15rem}

  .czu-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}

  .note{color:#9ca3af;font-size:.85rem}
  .ok{color:#4ade80}.bad{color:#f87171}
  .tt{border-collapse:collapse;margin:6px 0;font-size:.82rem;font-variant-numeric:tabular-nums}

  .czu-explain{overflow-x:auto}
  .czu-summary{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:14px 16px;margin-bottom:20px}

  .czu-finish{text-align:right;margin:10px 0 30px}
  .czu-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .czu-modal.hidden{display:none}
  .czu-modalbox{background:#1f2937;border:1px solid #4b5563;border-radius:10px;padding:20px;max-width:440px;color:#e5e7eb}
  .czu-modalbox h3{font-size:1.2rem;margin-bottom:8px}.czu-modalbox .warn{color:#facc15;margin-top:6px}
  .czu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .czu-tile{display:block;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:14px;transition:border-color .15s,transform .15s}
